<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아니, 그게 아니고</title>

<meta property="og:type" content="article">
<meta property="og:title" content="아니, 그게 아니고">
<meta property="og:description" content="AI 답을 고치면서 배운 것들 — 대구일중학교 체육교사 이길봉">

<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a pocket essay book — same shell as 「자격 대신, 공간」·「내가 묻지 않았던 것들」. Cover → one chapter per screen → quiet "다음" rule at each chapter's foot. */
:root{
  --paper:#F2F3EC;
  --ink:#1B211C;
  --soft:#5B6359;
  --rule:#D6D9CC;
  --court:#244335;
  --court-ink:#E9ECE2;
  --ball:#EBCB2E;
  --ball-dk:#C9A912;
  --mark:#E9DC8E;
  --accent-ink:#244335;
  --serif:"Gowun Batang","Noto Serif KR","Nanum Myeongjo",serif;
  --display:"Song Myung","Gowun Batang","Noto Serif KR",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141814;--ink:#E5E7DD;--soft:#9EA597;--rule:#2E352D;--court:#18301F;--court-ink:#E5E7DD;--mark:#4A4417;--accent-ink:#C9D3C0;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#141814;--ink:#E5E7DD;--soft:#9EA597;--rule:#2E352D;--court:#18301F;--court-ink:#E5E7DD;--mark:#4A4417;--accent-ink:#C9D3C0;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ball-dk);outline-offset:3px;border-radius:4px}

/* ---------- shell ---------- */
.wrap{max-width:34rem;margin:0 auto;padding-inline:20px;padding-block:0 56px}
.view[hidden]{display:none!important}

/* cover */
#cover{min-height:100%;display:flex;flex-direction:column}
#cover .wrap{width:100%}
.photo{margin:0;max-width:34rem;margin-inline:auto}
.photo img{display:block;width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;object-position:50% 55%;max-height:46vh;background:#fff}
.photo figcaption{font-family:var(--sans);font-size:12px;color:var(--soft);padding:8px 20px 0;letter-spacing:.02em}
/* 표지 그림이 아직 없을 때 자리만 잡아 두는 틀 — img에 src가 들어오면 자동으로 사라짐 */
.photo .slot{aspect-ratio:4/3;max-height:46vh;border:1px dashed var(--rule);display:grid;place-items:center;font-family:var(--sans);font-size:12px;color:var(--soft);letter-spacing:.06em}
.cover-top{padding-top:28px;display:grid;gap:14px}
.chimg{margin:28px 0 20px}
.chimg img{display:block;width:100%;aspect-ratio:3/4;max-height:56vh;object-fit:cover;border-radius:4px}
.org{font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.08em;color:var(--soft)}
.ctitle{font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,58px);line-height:1.15;margin:0;text-wrap:balance}
.csub{font-size:18px;color:var(--ink)}
.byline{font-family:var(--sans);font-size:14px;color:var(--soft)}
.toc{margin-top:44px;border-top:1px solid var(--rule)}
.toc ol{list-style:none;margin:0;padding:0}
.toc button{width:100%;display:grid;grid-template-columns:3.4rem 1fr auto;align-items:baseline;gap:6px;background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 2px;text-align:left;cursor:pointer}
.toc button:hover .tt{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--ball-dk)}
.toc .tn{font-family:var(--sans);font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.toc .tt{font-size:17px}
.toc .ta{font-family:var(--sans);font-size:13px;color:var(--soft)}
.start{margin-top:32px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;width:100%;padding:18px 2px;border:0;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);background:none;color:var(--ink);font-family:var(--serif);font-size:18px;cursor:pointer}
.start span:last-child{font-family:var(--sans);font-size:15px}

/* reader */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .in{max-width:34rem;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--sans);font-size:13px;color:var(--soft)}
.bar button{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--soft)}
.dots{display:flex;gap:6px;align-items:center}
.dots b{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.dots b.on{background:var(--ball);box-shadow:inset -1px -1px 0 var(--ball-dk);width:9px;height:9px}
.dots b.done{background:var(--soft);opacity:.5}

.chead{padding-top:44px;padding-bottom:8px;display:grid;gap:10px}
.cnum{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--accent-ink)}
.chead h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,9vw,42px);line-height:1.2;margin:0;text-wrap:balance}
.chead hr{width:28px;height:1px;border:0;background:var(--ink);margin:10px 0 0}

.prose{font-size:17.5px;line-height:1.95;letter-spacing:-.003em}
.prose p{margin:0 0 1.25em}
.prose p.first::first-letter{font-family:var(--display);font-size:2.2em;line-height:1;float:left;margin:.08em .12em 0 0;color:var(--accent-ink)}
.prose h3{font-family:var(--serif);font-weight:700;font-size:18px;margin:2em 0 .5em}
.prose em{font-style:normal;font-weight:700}
.prose .big{font-family:var(--display);font-size:24px;line-height:1.5;margin:1.6em 0;padding:18px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);text-align:center;text-wrap:balance}
.prose p.last{margin-top:2.6em}
.sep{text-align:center;color:var(--soft);letter-spacing:.6em;margin:2em 0}

.next{margin-top:48px;border-top:1px solid var(--rule);padding-top:22px;display:grid;gap:18px}
.next button.go{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:left;padding:16px 2px;border:0;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);background:none;color:var(--ink);cursor:pointer}
.go small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:var(--soft);margin-bottom:4px}
.go strong{font-family:var(--display);font-weight:400;font-size:21px}
.go .arr{flex:none;font-family:var(--sans);font-size:18px;color:var(--soft)}
.back{background:none;border:0;font-family:var(--sans);font-size:14px;color:var(--soft);cursor:pointer;justify-self:start;padding:4px 0}
.res{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:18px 2px;font-family:var(--sans);font-size:14.5px;line-height:1.7;display:grid;gap:8px}
.res a{font-weight:600;color:var(--ink);text-decoration-color:var(--ball-dk);text-underline-offset:4px;word-break:break-all}
.res p{margin:0;color:var(--soft)}
.fin{text-align:center;font-family:var(--sans);font-size:12px;letter-spacing:.12em;color:var(--soft);margin-top:12px}

/* 3권: 본문 글자를 키움 (17.5 → 19px) */
.prose{font-size:19px;line-height:1.9}
.prose .big{font-size:26px}
.prose p.first{display:flow-root}
/* 책의 끝 줄 — 첫 줄과 같은 말, 제목 글꼴로 따로 세움 */
.prose .say{font-family:var(--display);font-size:28px;line-height:1.4;margin:2.4em 0 0;text-align:center;color:var(--accent-ink)}
.res .row{display:grid;gap:2px}
.photo .slot{width:100%;aspect-ratio:16/9}
</style>
</head>

<section id="cover" class="view">

    <img id="coverImg" alt="아침 운동장에 라인을 긋는 체육교사의 뒷모습 — 두들 그림" hidden>

<!-- chapters -->
<template data-t="가장 많이 한 말" data-label="들어가며">
<p class="first">"아니, 그게 아니고."</p>
<p>매일 쓰는 AI에게 내가 지금까지 가장 많이 한 말이 뭐냐고 물으면 돌아오는 대답이다. 고맙다도 아니고 잘했다도 아니다.</p>
<p>처음부터 이 말을 한 건 아니다. 스레드 같은 데서 AI 쓰는 법을 찾아보면 다들 이렇게 시작하라고 했다. 넌 체육수업 전문가야. 넌 평가 전문가야. 넌 30년 차 선배 교사야. 나도 그렇게 물었다. 요즘은 그렇게 전문가를 부르지 말라는 글도 올라온다.</p>
<p>장난삼아 그 전문가들을 한 화면에 모아 본 적도 있다. 수업설계 코치, 평가 전문가, 30년 차 선배 교사, 체육 시간이 싫은 학생까지. 이름은 토크수업이라고 붙였다. 장난으로 만든 것치고는 쓸 만했다. 제일 많이 쓴 사람은 나다. 몇몇 체육 선생님께 알렸는데 반응은 조용했다.</p>
<p>그런데 AI와 무언가를 처음 만든 날의 대화를 다시 찾아보니, 그날 나는 전문가를 부르지 않았다.</p>
<p>2026년 2월 26일이었다. 새 학기 반 편성을 발표해야 했다. 첫마디는 "자, 급한 일이야"였다. 명단은 엑셀로 있고, 학생이 이름과 생년월일로 자기 반만 확인하면 좋겠고, 내가 만들 수 있는 수준이면 좋겠다고 했다.</p>
<p>AI는 파일 하나면 30분 안에 된다고 했다.</p>
<p>나는 보안이 확실했으면 좋겠다고 했다. 이게 털리는 순간 민원이 엄청나다고.</p>
<p>그러자 답이 바뀌었다. 그 방식은 키 하나만 누르면 전체 학생 명단이 다 보인다고 했다. 방금 30분이면 된다던 그 방식이었다.</p>
<p>그날 나는 "아니"라는 말을 쓰지 않았다. 그런데 지금 보면 그게 첫 번째였다.</p>
<p class="big">코딩은 1도 몰랐다.<br>하지만 명단이 새면 무슨 일이 생기는지는 알고 있었다.</p>
<p>그 뒤로도 고칠 것은 계속 나왔다. 휴대폰으로 볼 테니 화면을 맞춰 달라고 했고, 번호는 빼 달라고 했다. 다 됐다 싶었는데 결과 화면에 'Null번'이 떴다.</p>
<p>특별한 기술은 없었다. 내가 한 건 대화였다. 전문가를 부르는 대신 내 사정을 먼저 말했고, 돌아온 답이 내 사정과 맞지 않으면 그렇다고 말했다.</p>
<p>이 글은 그 말들을 모은 것이다.</p>
</template>

<template data-t="하찮은 것들" data-label="1장">
<p class="first">처음 몇 달 동안 AI와 한 일은 수업이 아니었다. 하찮은 것들이었다.</p>
<p>3월에는 학부모에게 보낼 안전 안내 문자를 부탁했다. 이모지가 달린 안내문이 왔다. "아니, 알림용으로 정중하게 문자로 갈 수 있게 요약해서 줘. 이모지 빼고." 기록에 남은 것 가운데 꽤 이른 "아니"다.</p>
<p>4월에는 학교폭력 실태조사 안내장을 만들었다. 담임 선생님들께 카카오톡으로 보낼 카드 한 장이었다. 977명이 한꺼번에 접속하면 와이파이가 버틸지 모르겠다는 농담도 한 줄 넣었다. 받아 보니 글씨가 작았다. 시간표는 없어도 됐다. 글씨를 키우고 시간표를 뺐다.</p>
<p>수업관리 앱도 이때 만들었다. 휴대폰에서 열면 오늘 들어갈 반과 그 반의 차시가 뜬다. 몇 주 쓰고 나니 아쉬운 데가 생겼다. 지난 시간에 뭘 했는지 이어서 보기가 어려웠고, 컴퓨터에서는 손대기가 불편했다. 고쳐 달라고 하면서 하나를 먼저 말해 두었다. 열자마자 오늘 수업을 알려 주는 첫 화면, 그게 제일 좋다고.</p>
<p>문자의 이모지, 안내장의 글씨 크기, 앱의 첫 화면. 적어 놓고 보니 하찮다. 수업이 달라진 것도 아니고 아이들이 뭘 더 배운 것도 아니다. AI로 일을 덜었을 뿐이다. 요즘도 그렇게 쓴다.</p>
<p>그런데 이 하찮은 것들이 연습이 됐다.</p>
<p>AI가 틀린 건 없었다. 이모지가 달린 문자도, 시간표가 든 안내장도 그 자체로는 멀쩡했다. 다만 받는 사람이 누구인지는 나만 알았다. 학부모가 학교 문자를 어떻게 읽는지, 담임이 그 시간에 무엇을 궁금해하는지, 내가 수업에 들어가기 전에 무엇을 보고 싶은지. 나는 그걸 말해 주지 않았다.</p>
<p class="big">"아니"는 AI가 틀렸다는 말이 아니었다.<br>누가 읽을 글인지 말해 주지 않은 건 나였다.</p>
<p>4월 어느 날에는 다른 걸 물었다. 체육 수업에 AI를 어떻게 쓸 수 있느냐고. 아이디어 열 개가 왔다. 자세 분석, 영상 분석 같은 것들이었다. 전부 내가 이미 떠올려 본 것들이었다.</p>
<p>그날은 "아니"가 길어졌다. 도구 이야기를 접고 수업 이야기를 한참 했다. 서른 명을 한 시간에 다 봐 줄 수 없다는, 체육교사라면 다 아는 이야기였다.</p>
<p>문자를 고칠 때는 "아니"가 금방 나왔다. 수업 앞에서는 뭐가 아닌지 말하는 데 시간이 걸렸다.</p>
</template>

<template data-t="아니, 그게 아니고" data-label="2장">
<p class="first">2학기에 플래그풋볼을 가르친다. 수업에 쓰는 작전판이 하나 있다. 아이들이 태블릿에서 수비 대형을 고르고 선수마다 뛸 길을 정해 주면, 화면 속 선수들이 그대로 뛴다.</p>
<p>9월에 이 작전판을 3D로 볼 수 있게 했다. 처음 나온 선수들은 기둥에 머리를 얹은 모양이었다. 나는 미식축구 게임 화면을 보여 주며 이 정도는 안 되느냐고 물었다. 다들 쉽게 만든다는데 왜 나한테는 안 해 주느냐고도 했다.</p>
<p>AI의 답은 이렇게 시작했다. "어렵습니다. 솔직하게 선을 긋겠습니다." 그런 게임은 수백 명이 몇 해를 들여 만든다고 했다. 그림이 좋아질수록 아이들은 작전보다 그림을 보게 된다는 말도 했다.</p>
<p>이번에는 내가 "아니"를 들은 쪽이었다. 나는 한발 물러섰다. "내가 뭘 그 정도까지 했겠어. 어차피 난 수업용이야."</p>
<p>게임 같은 3D는 접었다. 그림에 매달리지 않기로 했다. 그런데 AI가 만들어 주는 화면이 생각보다 좋았다. 광고판 하나쯤은 세우고 싶어졌다. 거기에 내가 만든 티를 내고 싶었다. 일주일 뒤에는 경기장 광고판에 넣을 문구를 고르고 있었다. "가딩 금지 푸싱도 금지." "터치다운 세레머니도 수행평가에 넣어주세요." 하늘에 구름이 생겼고 관중석이 올라갔다. 재미있었다. 다음은 선수들 옷 차례였다.</p>
<p>9월 30일, 작전판을 통째로 주고 수업에 쓸 만한지 봐 달라고 했다. AI는 작전을 2천 번쯤 돌려 보고 숫자를 가져왔다. 화면이 초록불로 "열렸다"고 알려 줘서 던진 공 174개 가운데 69개가 수비 손에 걸렸다. 열 번에 네 번이다. 아이들 쪽에서 보면 초록불을 보고 던졌는데 막히는 일이 되풀이되는 것이다.</p>
<p>경고도 붙어 있었다. 하늘, 구름, 광고판, 다음 차례인 옷. 이 가운데 아이들이 공간을 더 잘 알게 해 주는 건 거의 없다고.</p>
<p class="big">열 번에 네 번 틀리는 판 위에<br>나는 광고판을 달고 있었다.</p>
<p>할 말이 없었다. 나도 걸리는 데가 있긴 했다. 써 보면 막히는 작전이 너무 많아서, 아이들에게 실패할 작전만 쥐여 주는 것 같았다. 그 느낌에 숫자가 붙은 것이다. 예쁜 것보다 판정부터 고치자고 했다.</p>
<p>고치고 나서 다시 돌렸다. 초록불을 보고 던졌는데 막히는 일은 없어졌다. 그리고 하나를 더 알았다. 아무렇게나 짠 작전 250개 가운데 242개에는 열리는 순간이 있었다. 실패할 작전만 준 게 아니었다. 열리는 순간이 화면에 안 보였을 뿐이다.</p>
<p>열흘 뒤 나는 또 3D가 좀 더 좋아졌으면 좋겠다고 했다. 사람은 잘 안 변한다. 지금도 AI가 좋아질 때마다 이 작전판을 더 멋있게 만들고 싶다. AI는 얼굴과 머리카락이 있는 사람 모델을 구해 왔다. 남학생과 여학생을 섞어 세우겠다고 했다.</p>
<p>그걸 보고서야 알았다. 내가 바란 건 그게 아니었다.</p>
<p>"아니야, 이건 아니야. 그냥 유니폼 정도만 입히자."</p>
<p>한 달 전에는 내가 "아니"를 들었다. 그사이 AI가 달라진 건 없었다. 나는 열 번에 네 번이라는 숫자를 봤다.</p>
<p>어차피 난 수업용이야. 그 말이 무슨 뜻인지는 한 달이 지나서 알았다.</p>
</template>

<template data-t="공간을 가르치려면" data-label="3장">
<p class="first">광고판에는 아니라고 했고 판정에는 그렇다고 했다. 둘을 가른 기준은 작전판보다 먼저 생겼다.</p>
<p>플래그풋볼은 내가 해 본 적이 없는 종목이다. 학생 때 배운 적도 없고 경기를 본 적도 없다. 5월에 AI와 2학기 수업 이야기를 하다가 그 말을 했다. 축구, 농구, 배구 말고 다른 걸 해 보고 싶었는데 정작 나는 그 종목을 몰랐다.</p>
<p>그래도 해 보기로 한 건 가르치려는 것이 종목이 아니었기 때문이다. 빈 곳을 만드는 일, 공 없는 사람이 움직이는 일. 그건 다른 종목에서 여러 해 가르쳐 온 것이었다.</p>
<p>지난 글에서 나는 AI에게 묻지 않고 시키기만 했다고 썼다. 그 말은 지금도 맞다. 다만 시키기 전에 정해 둔 것이 하나 있었다. 8월에 수업을 짜면서 차시도 평가도 아닌 한 줄을 먼저 썼다.</p>
<p class="big">공간을 이해하는 학생.</p>
<p>이 수업에서 아이들이 가져갈 것이 패스인지, 협동인지, 공간인지. 그걸 먼저 정했다. 졸업하고 플래그풋볼을 다시는 안 하더라도 축구장이나 농구 코트에서 빈 곳이 보이면 된다고 생각했다.</p>
<p>평가도 거기에 맞췄다. 패스가 성공했는지는 점수에 넣지 않기로 했다. 서술형에서는 "빨라서 됐다"라고 쓴 답과 "수비가 안쪽으로 몰려서 바깥이 비었다"라고 쓴 답을 다르게 보기로 했다.</p>
<p>한 줄이 정해지자 도구에서 뺄 것이 보였다. 8월 31일, 작전판을 다시 만들면서 나는 아이들이 선을 마음대로 긋지 못하게 하자고 했다. 뛸 길은 이름이 붙은 것 가운데서만 고르게. 말해 놓고 자신이 없어서 물었다. "별론가? 고민이 되네."</p>
<p>AI는 그게 맞다고 했다. 마음대로 그리게 하면 중학교 2학년은 다섯 번 꺾고 원을 그리는, 운동장에서는 뛸 수 없는 길을 그리고, 그러면 공간이 아니라 그리기를 고민하게 된다고 했다. 길에 이름이 있으면 그 이름이 운동장으로 따라간다는 말도 했다. "너 슬랜트, 너 컬."</p>
<p>그날 AI는 한 가지를 더 말해 주었다. 이 판은 거짓말을 조금 한다고. 판 속의 수비는 언제나 0.3초 늦지만 진짜 수비는 그렇지 않아서, 잘하는 아이는 안 속고 못하는 아이는 더 속는다고 했다.</p>
<p>AI로 일을 덜 수 있다. 나도 그렇게 쓴다. 문자와 안내장이 그랬다. 그런데 이날 덜어 낸 것은 내 일이 아니었다. 아이들 손에서 선 긋기를 덜어 냈더니 남은 고민이 하나가 됐다. 누구를 어디로 보내면 빈 곳이 생기는가.</p>
<p class="big">기능 하나를 덜었더니<br>고민 하나가 또렷해졌다.</p>
<p>그 뒤로 작전판에 무엇을 넣자는 말이 나올 때마다 같은 걸 물을 수 있었다. 이게 있으면 아이들이 공간을 더 잘 보는가. 광고판은 아니었다. 사람 얼굴도 아니었다. 판정은 맞았다.</p>
<p>그 한 줄이 생기고 나서 "아니"가 쉬워졌다. 어려운 건 한 줄을 정하는 일이었고, 그건 AI가 대신 써 주지 않았다.</p>
</template>

<template data-t="라인만 그렸을 뿐인데" data-label="4장">
<p class="first">교실에서 아이들은 작전판에 열광했다. 게임 같다고 했다. 수비 대형을 바꿔 가며 돌리고 또 돌렸다.</p>
<p>판 속에서는 공이 멀리 날아간다. 그래서 처음 나온 작전은 대개 비슷했다. 한 명을 끝까지 뛰게 하고 20야드 넘게 던지는 것. 나는 그걸 로또 전략이라고 부른다.</p>
<p>운동장에 나가서 내가 한 일은 라인을 그린 것뿐이다. 정식 구장을 8할로 줄여 두 면을 그렸다.</p>
<p>거기서 아이들은 자기 실력을 알았다. 20야드는 날아가지 않았다. 나는 그게 아니라고 말하지 않았다.</p>
<p class="big">로또 전략에 "아니"라고 한 건<br>운동장이었다.</p>
<p>8월에 AI는 이 판이 거짓말을 조금 한다고 했다. 그 거짓말은 라인 위에서 드러났다.</p>
<p>몇 주가 지나자 작전이 달라졌다. 10야드 안쪽으로 짧게 던지기 시작했다.</p>
<p>그런데 공을 받으러 뛴 아이들이 전부 한자리에서 만났다. 가운데였다. 수비도 거기 다 와 있었다. 쿼터백은 던질 데가 없었다. 다 모이니까 자리가 없다는 말은 아이들 입에서 먼저 나왔다.</p>
<p>그다음부터 한 명이 바깥으로 빠지기 시작했다. 수비가 2-2로 섰을 때다. 러셔가 쿼터백 쪽으로 뛰어나가면 그 자리가 빈다. 그때 가운데 있던 한 명이 사이드라인 쪽으로 뛰어 수비를 데리고 나간다. 그러면 가운데가 통째로 빈다.</p>
<p>2-2는 가운데가 약하다는 말을 나는 한 적이 없다. 아이들이 찾았다. 작전판에서는 이렇게도 저렇게도 돌려 봤지만 거기까지는 가지 못했다. 운동장에서 수비 앞에 서 보고서야 알았다.</p>
<p>그 뒤로는 공격 전에 모여 서는 허들에서 손으로 서로의 자리를 짚어 가며 약속하는 아이가 보였다. 공을 받지 않을 친구를 어디로 뛰게 해서 수비를 데려갈지를 두고 자기들끼리 이야기했다.</p>
<p>잘 안 되는 날이 더 많다. 뛰어올랐다가 공을 놓치고, 패스는 바닥에 떨어진다. 놓친 아이들은 다시 줄을 선다.</p>
<p>공간을 이해하는 학생. 8월에 써 둔 한 줄이다. 모든 아이들이 거기까지 갔다고는 말하지 못하겠다. 다만 무엇을 고민하는지가 달라진 건 확실하다. 멀리 던질 사람을 찾던 아이들이 빈 곳을 만들 방법을 이야기한다.</p>
</template>

<template data-t="일요일 밤" data-label="5장">
<p class="first">일요일 밤이면 GPT에서 메시지가 온다. 내가 그렇게 걸어 두었다. 플래그풋볼 5대5 수업을 이번 주에는 어떻게 하면 좋을지.</p>
<p>내가 진도를 말해 주면 이번 주에 무엇을 하면 좋겠는지를 알려 준다. 처음에는 결이 잘 맞았다. 듣고, 수업에 넣을지 고민했다.</p>
<p>지금은 잘 맞지 않는다. 비가 와서 수업이 밀렸고, 아이들은 AI가 말하는 만큼 따라오지 못한다. 내 능력이 모자라서일 수도 있다. AI는 이제 경기를 하자고 하는데 아이들은 아직 거기까지 가지 못했다. 그러면 나는 또 아니라고 한다.</p>

<p>일요일 밤에 누가 먼저 수업 이야기를 꺼낸다. 그러면 나는 지난주 수업이 어땠는지를 떠올리게 된다. 어느 반이 어디까지 갔는지, 뭐가 안 됐는지. 안 맞는 답에 "아니"라고 하다 보면 이번 주에 내가 무엇을 하려는지가 정해진다.</p>
<p>동료 교사는 아니다. 다만 동료 선생님께 일요일 밤에 연락해서 수업 이야기를 하자고 할 수는 없다. 그 시간에 한 주 수업을 닫고 다음 주 수업을 여는 자리가 하나 생겼다. 내가 얻은 건 그것이다.</p>

<template data-t="내 편만 들어 주는 것 같아서" data-label="6장">
<p class="first">내가 "이게 더 낫지 않아?" 하고 물으면 AI는 대개 그렇다고 한다. 내가 AI를 잘 써서 그런 건지, AI가 내 말을 들어 주는 건지 모르겠다.</p>
<p>어쩌면 나는 반대로 말해 주기를 바랐는지도 모른다. 그건 틀렸습니다. 그렇게 하면 안 됩니다.</p>
<p>3월에 AI에게 부탁해 둔 것이 있다. 나는 학생을 위한 도구를 만들고 싶다. 내가 편하려고, 내가 뽐내려고 만드는 쪽으로 흐르면 경고해 달라.</p>

<p>그래서 지금은 같은 것을 여러 곳에 묻는다. 한 AI에게 물은 것을 다른 AI에게도 묻고, 한쪽이 한 말을 다른 쪽에 보여 주며 어떻게 생각하느냐고 묻는다. 답이 갈리는 곳이 생긴다. 거기가 내가 다시 생각해야 하는 곳이다.</p>
<p>"아니"는 내가 하는 말인 줄만 알았다. 나에게 "아니"라고 해 줄 상대를 만들어 두는 것도 내 일이었다.</p>
<p>그 가운데 가장 분명하게 말해 주는 건 여전히 운동장이다.</p>

<template data-t="수업 이야기를 할 상대" data-label="맺으며">
<p class="first">AI가 어디까지 갈지 나는 모른다. 너무 빨리 달라져서, 쓰지 말자는 사람도 늘어날 것 같다. 기우일 수 있다. 다만 지금도 학생에게 AI 도구를 쓰게 하려면 학교운영위원회 심의부터 거쳐야 한다.</p>
<p>교사가 수업을 준비하면서 쓰는 건 다른 이야기다. 나는 수업 준비 쪽에 기대가 크다.</p>
<p>각도를 재고, 속도를 계산하고, 얼마나 멀리 던졌는지 재고, 동작을 분석하는 일은 AI가 나보다 잘할 것이다. 영상 분석에 AI를 쓰는 건 좋은 일이다. 하지만 수업을 계획하고 디자인해서 아이들 앞에서 끌고 가는 일은 체육교사의 일이다. 그 일을 할 때 AI는 물으면 같이 고민해 준다.</p>
<p>돌아보면 이 글에 적은 일이 다 그랬다. 문자 한 통을 고칠 때도, 작전판의 판정을 고칠 때도, 일요일 밤에 다음 주 수업을 생각할 때도 이야기를 받아 주는 상대가 있었다. 내가 "아니, 그게 아니고"라고 하면 다시 해 주었고, 가끔은 나에게 아니라고 해 주었다.</p>
<p>AI 덕분에 일을 덜었다. 덜어 낸 자리에는 수업 고민이 들어왔다. 공간을 어떻게 보여 줄지, 다음 주에는 무엇을 할지. 혼자였다면 미뤄 두었을 고민들이다.</p>
<p>특별한 기술은 없었다. 내 수업에서 무엇을 가르치고 싶은지를 말했고, 아닌 건 아니라고 했다.</p>
<p>내년에는 무엇을 물어보게 될지 벌써 궁금하다. 다른 체육 선생님들이 AI와 나눈 수업 이야기도 듣고 싶다.</p>
<p>매일 쓰는 AI에게 내가 가장 많이 한 말을 물으면 당분간은 같은 대답이 나올 것이다. 그 말을 하는 동안은 수업 이야기가 이어지니까.</p>
<p class="say">"아니, 그게 아니고."</p>
</template>

<script>
(function(){
  const tpls=[...document.querySelectorAll('template[data-t]')];
  const chapters=tpls.map((t,i)=>({title:t.dataset.t,html:t.innerHTML,img:t.dataset.img,alt:t.dataset.alt,label:t.dataset.label||((i+1)+'장'),num:t.dataset.label||String(i+1)}));
  const N=chapters.length;
  const $=id=>document.getElementById(id);
  const cover=$('cover'),reader=$('reader');

  /* cover image: show when a src is present */
  const ci=$('coverImg');if(ci.getAttribute('src')){ci.hidden=false;$('coverSlot').hidden=true;}

  /* table of contents */
  const toc=$('toc');
  chapters.forEach((c,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.type='button';
    b.innerHTML='<span class="tn">'+c.num+'</span><span class="tt"></span><span class="ta" aria-hidden="true">→</span>';
    b.querySelector('.tt').textContent=c.title;b.addEventListener('click',()=>open(i));li.appendChild(b);toc.appendChild(li);});
  const dots=$('dots');for(let i=0;i<N;i++)dots.appendChild(document.createElement('b'));

  function open(i){
    const c=chapters[i];
    cover.hidden=true;reader.hidden=false;
    $('cnum').textContent=c.label;
    $('ctitle').textContent=c.title;
    $('body').innerHTML=c.html;
    if(c.img){$('chimgEl').src=c.img;$('chimgEl').alt=c.alt||'';$('chimg').hidden=false;}else{$('chimg').hidden=true;}
    $('pos').textContent=(i+1)+' / '+N;
    [...dots.children].forEach((d,k)=>{d.className=k===i?'on':k<i?'done':'';});
    const nx=$('next');nx.innerHTML='';
    if(i<N-1){
      const go=document.createElement('button');go.type='button';go.className='go';
      go.innerHTML='<span><small>다음 · '+chapters[i+1].label+'</small><strong></strong></span><span class="arr" aria-hidden="true">→</span>';
      go.querySelector('strong').textContent=chapters[i+1].title;go.addEventListener('click',()=>open(i+1));nx.appendChild(go);
    }else{
      const r=document.createElement('div');r.className='res';
      r.innerHTML='<p>이 글에 나온 공간 작전판은 여기 있습니다.</p><a href="https://bbonng.github.io/flagboard/" target="_blank" rel="noopener">bbonng.github.io/flagboard</a><p>앞의 두 글입니다.</p><a href="https://bbonng.github.io/pickleball/book/" target="_blank" rel="noopener">자격 대신, 공간</a><a href="https://bbonng.github.io/AIPE/book/" target="_blank" rel="noopener">내가 묻지 않았던 것들</a>';
      nx.appendChild(r);
      const home=document.createElement('button');home.type='button';home.className='go';
      home.innerHTML='<span><small>끝까지 읽어 주셔서 고맙습니다</small><strong>처음으로</strong></span><span class="arr" aria-hidden="true">↺</span>';
      home.addEventListener('click',showCover);nx.appendChild(home);
      const f=document.createElement('div');f.className='fin';f.textContent='운동장에서 · 이길봉';nx.appendChild(f);
    }
    if(i>0){const bk=document.createElement('button');bk.type='button';bk.className='back';bk.textContent='← '+chapters[i-1].label+' '+chapters[i-1].title;bk.addEventListener('click',()=>open(i-1));nx.appendChild(bk);}
    try{history.replaceState(null,'','#ch'+(i+1));}catch(e){}
    window.scrollTo(0,0);
  }
  function showCover(){reader.hidden=true;cover.hidden=false;try{history.replaceState(null,'','#cover');}catch(e){}window.scrollTo(0,0);}
  $('startBtn').addEventListener('click',()=>open(0));
  $('toCover').addEventListener('click',showCover);

  const m=/^#ch(\d+)$/.exec(location.hash);
  if(m&&+m[1]>=1&&+m[1]<=N)open(+m[1]-1);
})();
</script>
</body>
</html>
